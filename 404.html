  <link rel="stylesheet" href="./assets/css/style.css?v=16">

  <script>
    (function () {
      document.documentElement.classList.add('js');

      // No cookies. Preferences are kept in localStorage only.
      var skins = ['paper', 'noir', 'gallery', 'signal'];
      var skin = null;

      try {
        skin = localStorage.getItem('display-skin');
        localStorage.removeItem('skin');
        localStorage.removeItem('season');
        localStorage.removeItem('effects');
      } catch (e) { /* storage can be blocked */ }

      if (skins.indexOf(skin) === -1) skin = 'paper';

      document.documentElement.setAttribute('data-skin', skin);

      try {
        var stored = localStorage.getItem('theme');
        if (stored === 'light' || stored === 'dark') {
          document.documentElement.setAttribute('data-theme', stored);
        }
        var lang = localStorage.getItem('lang');
        if (lang === 'de') document.documentElement.lang = 'de';
      } catch (e) { /* storage can be blocked */ }

      window.setTimeout(function () {
        if (!window.__shravanReady) {
          document.documentElement.classList.remove('js');
        }
      }, 2500);
    })();
  </script>
</head>
